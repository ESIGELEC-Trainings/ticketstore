server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://postgres:5432/ticketstore
spring.datasource.username=ticketstore_user
spring.datasource.password=ticketstore_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Redis ---
spring.data.redis.host=redis
spring.data.redis.port=6379

# Cache (activé mais mal utilisé volontairement pour le TP)
spring.cache.type=redis

# --- Actuator & Metrics ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=ticketstore-backend

# Liveness = OK (mais readiness pas encore configurée → failover lent volontaire)
management.endpoint.health.probes.enabled=true

# Pour rendre le bug de session cluster visible
server.servlet.session.timeout=30m
