# =============================================================================
# TicketStore - configuration de PRODUCTION (serveur exposé sur Internet)
#
# Usage sur le serveur :
#   cp .env.example .env   (puis remplir les valeurs)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Différences avec docker-compose.yml (version locale du TP) :
#   - Seul Traefik est exposé (ports 80/443), avec HTTPS automatique (Let's Encrypt)
#   - PostgreSQL, Redis, Prometheus, backends et frontend ne sont PAS exposés
#   - Mots de passe lus depuis le fichier .env (jamais commités)
#   - Redis protégé par mot de passe
#   - Grafana accessible en lecture seule sur https://grafana.<DOMAIN>
#   - Le dashboard Traefik n'est pas exposé
#   - Le CODE de l'application n'est pas modifié : les défauts volontaires du TP restent
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketstore
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ticketstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - ticketstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-1: &backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketstore
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: 8080
      INSTANCE_NAME: backend-1
      # Actuator : seuls health, info et prometheus sont activés
      # (de toute façon, /actuator n'est pas routé vers Internet, voir labels)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      # Limite mémoire de la JVM pour tenir sur un petit serveur
      JAVA_TOOL_OPTIONS: -Xmx${BACKEND_MAX_HEAP:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketstore-network
    labels:
      - "traefik.enable=true"
      # Seul /api est accessible depuis Internet
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=10s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  backend-2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend-2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - ticketstore-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  traefik:
    # v3.6+ obligatoire avec Docker Engine 29 (les versions plus anciennes
    # utilisent une API Docker refusée par le moteur : "client version 1.24 is too old")
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ticketstore-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - ticketstore-network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - ticketstore-network
    depends_on:
      - backend-1
      - backend-2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Les étudiants consultent les dashboards sans compte, en lecture seule
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - ticketstore-network
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  ticketstore-network:
    # Nom fixe pour que Traefik retrouve le réseau quel que soit le nom du projet
    name: ticketstore-network
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  letsencrypt:
